name: Dynamic Crypto Discovery
on:
  pull_request:
    paths:
      - 'backend/v19_crypto_asset_discovery.py'
      - 'tests/test_crypto_asset_discovery.py'
      - '.github/workflows/dynamic-crypto-discovery.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_crypto_asset_discovery.py
