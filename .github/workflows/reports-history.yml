name: Reports History Coverage
on:
  pull_request:
    paths:
      - 'backend/legacy/monolith.py'
      - 'tests/test_v19_reports_history_limit.py'
      - '.github/workflows/reports-history.yml'
  workflow_dispatch:
jobs:
  history-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_v19_reports_history_limit.py
      - run: python -m py_compile backend/legacy/monolith.py
