name: V19.0.12 Broker Reconciliation Safety
on:
  push:
    branches: [v19-0-12-sell-order-reconciliation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install fastapi
      - run: python -m py_compile backend/v19012_broker_reconciliation.py backend/main.py
      - run: python -m unittest discover -s tests -p 'test_v19012_broker_reconciliation.py' -v
