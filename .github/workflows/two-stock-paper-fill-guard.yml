name: TSLA SPCX Paper Fill Verifier Guards
on:
  pull_request:
    paths:
      - 'scripts/verify_two_stock_paper_fill.py'
      - 'tests/test_paper_fill_verifier_guards.py'
      - '.github/workflows/two-stock-paper-fill-guard.yml'
jobs:
  dry-run-and-credential-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_paper_fill_verifier_guards.py
      - run: python -m py_compile scripts/verify_two_stock_paper_fill.py
