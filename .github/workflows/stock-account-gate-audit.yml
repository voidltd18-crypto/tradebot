name: Stock Account Gate Audit
on:
  pull_request:
    paths:
      - 'backend/v19_stock_account_gate_audit.py'
      - 'backend/legacy/monolith.py'
      - 'tests/test_stock_account_gate_audit.py'
      - '.github/workflows/stock-account-gate-audit.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_stock_account_gate_audit.py
      - run: python -m py_compile backend/legacy/monolith.py backend/v19_stock_account_gate_audit.py
