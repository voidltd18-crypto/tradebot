name: Crypto Profit Limit Sell Safety
on:
  pull_request:
    paths:
      - "backend/v19_crypto_profit_sell_executor.py"
      - "backend/main.py"
      - "tests/test_crypto_profit_sell_executor.py"
      - "tests/test_crypto_profit_sell_broker_sim.py"
      - "tests/test_crypto_profit_sell_health.py"
      - "tests/test_crypto_sell_heartbeat_isolated.py"
      - ".github/workflows/crypto-profit-sell-safety.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_crypto_profit_sell_executor.py tests/test_crypto_profit_sell_broker_sim.py tests/test_crypto_profit_sell_health.py tests/test_crypto_sell_heartbeat_isolated.py
      - run: python -m py_compile backend/v19_crypto_profit_sell_executor.py backend/main.py
