name: V19 Memory Diagnostics

on:
  push:
    branches:
      - v19-research-memory-telemetry-20261018
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  memory-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile read-only diagnostics
        run: |
          python -m py_compile backend/v19_memory_sampler.py tests/test_v19_memory_sampler.py tests/test_v19_memory_repeated_cycles.py tests/test_v19_research_memory_inventory.py tests/test_v19_memory_integration_safety.py
      - name: Run memory unit tests
        run: |
          python -m unittest discover -s tests -p 'test_v19_memory_*.py' -v
      - name: Run monolith static inventory
        run: |
          python tests/test_v19_research_memory_inventory.py
