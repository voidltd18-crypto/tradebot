name: MARA First Dibs Retirement
on:
  pull_request:
    paths:
      - 'backend/legacy/monolith.py'
      - 'tests/test_mara_first_dibs_retirement.py'
      - '.github/workflows/mara-first-dibs-retirement.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_mara_first_dibs_retirement.py
      - run: python -m py_compile backend/legacy/monolith.py
