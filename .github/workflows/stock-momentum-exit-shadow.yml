name: Stock momentum exit shadow tests
on:
  pull_request:
    paths:
      - 'backend/stock_momentum_exit_shadow.py'
      - 'backend/stock_momentum_replay.py'
      - 'backend/stock_momentum_cost_model.py'
      - 'backend/stock_momentum_endofday_audit.py'
      - 'backend/stock_exit_paper_rehearsal.py'
      - 'backend/stock_exit_state_store.py'
      - 'backend/stock_sell_recovery_journal.py'
      - 'backend/stock_sell_recovery_postgres.py'
      - 'backend/stock_sell_recovery_disk.py'
      - 'backend/stock_sell_coordinator.py'
      - 'backend/stock_sell_alpaca_paper_adapter.py'
      - 'backend/sql/stock_sell_recovery_postgres_v1.sql'
      - 'backend/stock_paper_account_reader.py'
      - 'scripts/replay_fmc_csv.py'
      - 'scripts/audit_fmc_spike_release.py'
      - 'scripts/verify_fmc_paper_history_readonly.py'
      - 'scripts/export_fmc_alpaca_bars.py'
      - 'backend/main.py'
      - 'tests/test_stock_momentum_exit_shadow.py'
      - 'tests/test_stock_momentum_replay.py'
      - 'tests/test_stock_reference_activation_comparison.py'
      - 'tests/test_legacy_stock_runner_grace_regression.py'
      - 'tests/test_legacy_stock_sell_submission_lifecycle.py'
      - 'tests/test_stock_momentum_cost_model.py'
      - 'tests/test_stock_momentum_endofday_audit.py'
      - 'tests/test_stock_exit_paper_rehearsal.py'
      - 'tests/test_stock_exit_state_store.py'
      - 'tests/test_stock_sell_recovery_journal.py'
      - 'tests/test_stock_sell_recovery_postgres.py'
      - 'tests/test_stock_sell_recovery_disk.py'
      - 'tests/test_stock_sell_recovery_end_to_end.py'
      - 'tests/test_stock_sell_coordinator.py'
      - 'tests/test_stock_sell_alpaca_paper_adapter.py'
      - 'tests/test_stock_paper_account_reader.py'
      - 'tests/test_replay_fmc_csv.py'
      - 'tests/test_audit_fmc_spike_release.py'
      - 'tests/test_verify_fmc_paper_history_readonly.py'
      - 'tests/test_export_fmc_alpaca_bars.py'
      - '.github/workflows/stock-momentum-exit-shadow.yml'
  workflow_dispatch:
jobs:
  shadow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_stock_momentum_exit_shadow.py tests/test_stock_momentum_replay.py tests/test_stock_momentum_cost_model.py tests/test_replay_fmc_csv.py tests/test_export_fmc_alpaca_bars.py tests/test_stock_exit_paper_rehearsal.py tests/test_stock_exit_state_store.py tests/test_stock_sell_recovery_journal.py tests/test_stock_sell_recovery_postgres.py tests/test_stock_sell_recovery_disk.py tests/test_stock_sell_recovery_end_to_end.py tests/test_stock_sell_coordinator.py tests/test_stock_sell_alpaca_paper_adapter.py tests/test_stock_paper_account_reader.py tests/test_audit_fmc_spike_release.py tests/test_verify_fmc_paper_history_readonly.py tests/test_stock_momentum_endofday_audit.py tests/test_stock_reference_activation_comparison.py tests/test_legacy_stock_runner_grace_regression.py tests/test_legacy_stock_sell_submission_lifecycle.py
