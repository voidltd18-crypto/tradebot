name: V19 Crypto Diagnostics Safety
on:
  pull_request:
    paths:
      - 'backend/v19_crypto_exit_diagnostics.py'
      - 'backend/v19_crypto_sms.py'
      - 'backend/v19_telegram_crypto.py'
      - 'backend/v19_crypto_telegram_monitor.py'
      - 'backend/main.py'
      - 'backend/legacy/monolith.py'
      - 'tests/test_v19_crypto_exit_diagnostics.py'
      - 'tests/test_v19_crypto_sms.py'
      - 'tests/test_v19_telegram_crypto.py'
      - 'tests/test_v19_crypto_telegram_monitor.py'
      - '.github/workflows/v19-crypto-diagnostics.yml'
  workflow_dispatch:
jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_v19_crypto_exit_diagnostics.py tests/test_v19_crypto_sms.py tests/test_v19_telegram_crypto.py tests/test_v19_crypto_telegram_monitor.py
      - run: python -m py_compile backend/v19_crypto_exit_diagnostics.py backend/v19_crypto_sms.py backend/v19_telegram_crypto.py backend/v19_crypto_telegram_monitor.py backend/main.py backend/legacy/monolith.py
