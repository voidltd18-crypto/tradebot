name: Current main stock sell source audit
on:
  push:
    branches:
      - 'audit/stock-sell-current-main-20261111'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_current_stock_sell_lifecycle.py
