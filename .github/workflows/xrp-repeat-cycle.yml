name: XRP Repeat Dip Cycle
on:
  pull_request:
    paths:
      - 'backend/v19_xrp_repeat_cycle.py'
      - 'backend/v19_xrp_repeat_cycle_snapshot.py'
      - 'backend/v19_xrp_cycle_executor.py'
      - 'backend/main.py'
      - 'tests/test_xrp_repeat_cycle.py'
      - 'tests/test_xrp_repeat_cycle_snapshot.py'
      - 'tests/test_xrp_cycle_executor.py'
      - 'tests/test_crypto_xrp_full_roundtrip_simulation.py'
      - 'tests/test_xrp_cycle_sale_provenance.py'
      - '.github/workflows/xrp-repeat-cycle.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_xrp_repeat_cycle.py tests/test_xrp_repeat_cycle_snapshot.py tests/test_xrp_cycle_executor.py tests/test_crypto_xrp_full_roundtrip_simulation.py tests/test_xrp_cycle_sale_provenance.py
      - run: python -m py_compile backend/v19_xrp_repeat_cycle.py backend/v19_xrp_repeat_cycle_snapshot.py backend/v19_xrp_cycle_executor.py backend/main.py
