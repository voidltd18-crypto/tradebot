name: Two Stock Asset Safety
on:
  pull_request:
    paths:
      - 'backend/main.py'
      - 'backend/legacy/monolith.py'
      - 'backend/v19_two_stock_asset_preflight.py'
      - 'tests/test_two_stock_asset_preflight.py'
      - '.github/workflows/two-stock-asset-safety.yml'
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_two_stock_asset_preflight.py tests/test_two_stock_watch_mode.py
      - run: python -m py_compile backend/main.py backend/legacy/monolith.py backend/v19_two_stock_asset_preflight.py
