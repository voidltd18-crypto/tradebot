name: V19.0.16 Replay Link and Boundary Safety
on:
  push:
    branches: [v19-0-16-replay-link-integrity]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile backend/v19016_replay_bounds.py backend/v18344_replay_lab.py backend/v18351_live_stock_replay_capture.py
      - run: python -m unittest discover -s tests -p 'test_v19016_replay_bounds.py' -v
