name: Crypto Manual Sell Fix
on:
  pull_request:
    paths:
      - 'backend/legacy/monolith.py'
      - 'tests/test_crypto_manual_sell_tif.py'
      - '.github/workflows/crypto-manual-sell-fix.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_crypto_manual_sell_tif.py
      - run: python -m py_compile backend/legacy/monolith.py
