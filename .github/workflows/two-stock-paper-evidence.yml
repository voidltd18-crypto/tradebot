name: TSLA SPCX Paper Simulation and Evidence Safety
on:
  pull_request:
    paths:
      - 'backend/legacy/monolith.py'
      - 'tests/test_two_stock_paper_order_cycle.py'
      - 'tests/test_spcx_extended_evidence_safety.py'
      - '.github/workflows/two-stock-paper-evidence.yml'
jobs:
  simulated-orders-and-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_two_stock_paper_order_cycle.py tests/test_spcx_extended_evidence_safety.py tests/test_spcx_ipo_history_boundary.py tests/test_two_stock_asset_preflight.py tests/test_two_stock_watch_mode.py
      - run: python -m py_compile backend/legacy/monolith.py
