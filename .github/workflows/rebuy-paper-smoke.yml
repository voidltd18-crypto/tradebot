name: Paper Rebuy Smoke Safety
on:
  pull_request:
    paths:
      - 'scripts/check_crypto_rebuy_paper.py'
      - 'tests/test_rebuy_paper_smoke.py'
      - 'tests/test_rebuy_paper_manual_workflow.py'
      - '.github/workflows/manual-alpaca-paper-rebuy.yml'
      - '.github/workflows/rebuy-paper-smoke.yml'
jobs:
  paper-script-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_rebuy_paper_smoke.py tests/test_rebuy_paper_manual_workflow.py
      - run: python -m py_compile scripts/check_crypto_rebuy_paper.py
