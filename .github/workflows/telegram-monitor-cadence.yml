name: Telegram Monitor Cadence
on:
  pull_request:
    paths:
      - 'backend/v19_crypto_telegram_monitor.py'
      - 'tests/test_telegram_crypto_one_minute.py'
      - '.github/workflows/telegram-monitor-cadence.yml'
  workflow_dispatch:
jobs:
  cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_telegram_crypto_one_minute.py
      - run: python -m py_compile backend/v19_crypto_telegram_monitor.py
