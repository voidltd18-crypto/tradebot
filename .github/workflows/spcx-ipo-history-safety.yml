name: SPCX IPO History Safety
on:
  pull_request:
    paths:
      - 'backend/legacy/monolith.py'
      - 'tests/test_spcx_ipo_history_boundary.py'
      - '.github/workflows/spcx-ipo-history-safety.yml'
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_spcx_ipo_history_boundary.py tests/test_two_stock_watch_mode.py tests/test_two_stock_asset_preflight.py
      - run: python -m py_compile backend/legacy/monolith.py
