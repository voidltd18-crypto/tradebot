name: V19.0.10 Exit Forensics Safety
on:
  push:
    branches: [v19-0-10-profit-exit-forensics]
  pull_request:
    branches: [main]
jobs:
  forensics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install fastapi
      - run: python -m py_compile backend/main.py backend/v19010_exit_forensics.py
      - run: python -m unittest discover -s tests -p 'test_v19010_exit_forensics.py' -v
