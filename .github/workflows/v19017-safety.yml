name: V19.0.17 STOP Replay Validation
on:
  push:
    branches: [v19-0-17-stop-replay-validation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile backend/v19017_stop_replay_validation.py backend/v18344_replay_lab.py
      - run: python -m unittest discover -s tests -p 'test_v19017_stop_validation.py' -v
