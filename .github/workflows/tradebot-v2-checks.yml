name: TradeBot 2.0 safety checks
on:
  push:
    branches: [feature/tradebot-v2-clean-rebuild]
  pull_request:
    paths:
      - 'backend/tradebot_v2/**'
      - 'tests/test_tradebot_v2_*.py'
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile modules
        run: python -m py_compile backend/tradebot_v2/engine.py backend/tradebot_v2/research.py backend/tradebot_v2/ledger.py backend/tradebot_v2/store.py backend/tradebot_v2/execution_plan.py backend/tradebot_v2/app.py backend/tradebot_v2/offline_orders.py
      - name: Test safeguards
        run: python -m pytest -q tests/test_tradebot_v2_engine.py tests/test_tradebot_v2_research.py tests/test_tradebot_v2_ledger.py tests/test_tradebot_v2_execution_plan.py tests/test_tradebot_v2_offline_orders.py
