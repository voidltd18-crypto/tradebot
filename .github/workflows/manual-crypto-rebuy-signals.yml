name: Manual Crypto Rebuy Signal Tests
on:
  pull_request:
    paths:
      - 'backend/v19_manual_crypto_*.py'
      - 'tests/test_manual_crypto_*.py'
      - 'backend/main.py'
      - 'frontend/src/pages/ReportsPage.tsx'
      - '.github/workflows/manual-crypto-rebuy-signals.yml'
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m py_compile backend/v19_manual_crypto_rebuy_signal.py backend/v19_manual_crypto_rebuy_preview.py backend/v19_manual_crypto_recovery.py backend/main.py
      - run: python -m pytest -q tests/test_manual_crypto_rebuy_signal.py tests/test_manual_crypto_recovery.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
