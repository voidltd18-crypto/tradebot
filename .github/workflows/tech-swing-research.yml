name: Tech swing research safety tests
on:
  pull_request:
    paths:
      - 'backend/v20_tech_swing_research.py'
      - 'tests/test_v20_tech_swing_research.py'
      - '.github/workflows/tech-swing-research.yml'
  workflow_dispatch:
jobs:
  offline-research-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_v20_tech_swing_research.py
